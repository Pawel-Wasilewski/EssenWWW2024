<!DOCTYPE html>
<html lang="pl=PL">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="quiz.css">
        <title>Quiz</title>
    </head>
    <body>
        <header>
            <h1>
                Quiz
            </h1>
        </header>
        <main>
            <section class="panel_area">
                <div class="panel">
                    <h3>
                        Pytanie 1/19
                        <!-- PHP -->
                    </h3>

                    <hr>

                    <div class="question_container">
                        <h4>
                            What is <em>goodmorning</em> in polish?
                        </h4>
                        <!-- PHP -->
                    </div>
                    <form method="post">
                        <div class="options_answers">
                            <div class="options">
                                <div class="quiz_option_container">
                                    <input type="radio" name="option" class="quiz_option" value="dobranoc">
                                    <label for="dobranoc"> Dobranoc </label>
                                </div>
                                <div class="quiz_option_container">
                                    <input type="radio" name="option" class="quiz_option" value="whats ligma">
                                    <label for="whats ligma"> Dzień dobry </label>
                                </div>
                                <div class="quiz_option_container">
                                    <input type="radio" name="option" class="quiz_option" value="ligmastic">
                                    <label for="ligmastic"> Witaj </label>
                                </div>
                                <!-- PHP -->
                            </div>
                            <div class="answer_icon">
                                <div>
                                    X
                                </div>
                                <div>
                                    V
                                </div>
                                <div>
                                    X
                                </div>
                                <!-- PHP -->
                            </div>
                        </div>
                        <div class="panel_submit">
                            <button type="submit" id="submit"> Answer </button>
                        </div>
                        <!-- PHP Form Checking-->
                    </form>
                </div>
            </section>
        </main>
    </body>
</html>
