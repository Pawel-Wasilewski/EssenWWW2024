<!DOCTYPE html>
<html lang="pl=PL">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="quiz.css">
        <title>Quiz</title>
    </head>
    <body>
        <header>
            <h1>
                Quiz
            </h1>
        </header>
        <main>
            <section class="sections-area center">
                <section class="panel center" id="task1">
                        <!-- 1. Zaznacz wszystkie powitania -->
                    <h4 class="task-count">Question 1 of 4 </h4>
                    <h3 class="task-header">
                        Select all greetings
                    </h3>
                    <div class="options-area">
                        <div>
                            <input type="checkbox" name="option1-1" class="options-check">
                            <label for="option1">option1</label>
                        </div>
                        <div>
                            <input type="checkbox" name="option2-1" class="options-check">
                            <label for="option2">option2</label>
                        </div>
                        <div>
                            <input type="checkbox" name="option3-1" class="options-check">
                            <label for="option3">option3</label>
                        </div>
                        <div>
                            <input type="checkbox" name="option4-1" class="options-check">
                            <label for="option4">option4</label>
                        </div>
                        <div>
                            <input type="checkbox" name="option5-1" class="options-check">
                            <label for="option5">option5</label>
                        </div>
                    </div>
                    <button class="next-btn" onclick="next()">Next</button>
                </section>
                <section class="panel center" id="task2">
                        <!-- 4. Które słowo nie jest odmianą słowa "jeść"? -->
                    <h4 class="task-count">Question 2 of 4 </h4>
                    <h3 class="task-header">
                        What it isn't polish translation to <em>eat</em>
                    </h3>
                    <div class="options-area">
                        <div>
                            <input type="radio" name="option1-2" class="options-radio">
                            <label for="option1-2">option1</label>
                        </div>
                        <div>
                            <input type="radio" name="option2-2" class="options-radio">
                            <label for="option2-2">option2</label>
                        </div>
                        <div>
                            <input type="radio" name="option3-2" class="options-radio">
                            <label for="option3-2">option3</label>
                        </div>
                    </div>
                    <button class="next-btn" onclick="next()">Next</button>
                </section>
                <section class="panel center" id="task3">
                        <!-- 3. Dopasuje polskie tłumaczenia (Drag&Drop) -->
                        <h4 class="task-count">Question 3 of 4 </h4>
                        <h3 class="task-header">
                        Join polish translation to english 
                    </h3>
                    <div class="dad">
                        <div class="dragged-dad">
                            <div class="option-dad">
                                option1
                            </div>
                            <div class="option-dad">
                                option2
                            </div>
                            <div class="option-dad">
                                option3
                            </div>
                            <div class="option-dad">
                                option4
                            </div>
                        </div>
                        <div class="dropped-dad">
                            <div class="dropped" id="first">
                                <div class="area-drod-dad"></div> is text1
                            </div>
                            <div class="dropped" id="second">
                                <div class="area-drod-dad"></div> is text2
                            </div>
                            <div class="dropped" id="third">
                                <div class="area-drod-dad"></div> is text3
                            </div>
                            <div class="dropped" id="fourth">
                                <div class="area-drod-dad"></div> is text4
                            </div>
                        </div>
                    </div>
                    <button class="next-btn" onclick="next()">Next</button>
                </section>
                <section class="panel center" id="task4">
                        <!--2. Jak powiedzieć po polsku "I drink water"?-->
                        <h4 class="task-count">Question 4 of 4 </h4>
                        <h3 class="task-header">
                        Join polish translation to english
                    </h3>
                    <div class="input-area center">
                        <input type="text" name="input" placeholder="Answer..." class="text-input">
                    </div>
                    <button class="next-btn" onclick="next()">Next</button>
                </section>
            </section>
        </main>
    </body>
</html>
